<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>BST 시각화</title>
</head>
  <script>
  const slider = document.getElementById("keySlider");
  const keyValue = document.getElementById("keyValue");

  slider.addEventListener("input", () => {
    keyValue.value = slider.value;
  });
</script>
<body>
  <h1>BST 시각화</h1>
  <input id="keySlider" type="range" min="-100" max="100" value="30">
<output id="keyValue" for="keySlider">30</output>
  <button>Add Node</button>
  <button>Delete Node</button>
</body>
</html>
