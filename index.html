<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BST Visualizer</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: #eeeeee;
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 2px;
    }

    #engineStatus {
      margin-top: 10px;
      color: #999;
      font-size: 12px;
    }

    .visualization {
      flex: 1;
      width: 100%;
      padding: 0 20px;
    }

    #treeArea {
      position: relative;
      height: 48vh;
      min-height: 260px;
      overflow: hidden;
      border: 1px solid #252525;
      border-radius: 14px;
      background: #0d0d0d;
    }

    #treeSvg {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #treeSvg.dragging,
    #treeSvg.dragging .node {
      cursor: grabbing;
    }

    .node {
      cursor: pointer;
    }

    .node:hover circle {
      stroke: #ffaaaa;
      stroke-width: 3;
    }

    #emptyMessage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #777;
      text-align: center;
      line-height: 1.8;
      pointer-events: none;
    }

    #emptyMessage[hidden] { display: none; }

    .navigation-hint {
      margin: 10px 0 0;
      color: #888;
      font-size: 12px;
      text-align: center;
      line-height: 1.8;
    }

    .tree-info {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 14px;
      color: #999;
      font-size: 13px;
    }

    .tree-info strong { color: #79e0ad; }

    .inorder {
      max-width: 900px;
      margin: 18px auto 0;
      padding: 14px;
      border: 1px solid #252525;
      border-radius: 10px;
      font-size: 13px;
    }

    .inorder-label {
      margin-bottom: 8px;
      color: #999;
    }

    #inorderValue {
      max-height: 80px;
      overflow: auto;
      color: #ccc;
      font-family: monospace;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .controls {
      width: min(720px, calc(100% - 32px));
      margin: 24px auto;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      border: 1px solid #303030;
      border-radius: 18px;
      background: #151515;
    }

    .slider-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .slider-heading label {
      color: #bbb;
      font-size: 14px;
    }

    #keyValue {
      min-width: 76px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #242424;
      color: #79e0ad;
      text-align: center;
      font: bold 24px monospace;
    }

    #keySlider {
      width: 100%;
      margin: 0;
      accent-color: #79e0ad;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #777;
      font-size: 12px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      flex: 1 1 160px;
      min-height: 46px;
      padding: 12px 16px;
      border: 1px solid #414141;
      border-radius: 9px;
      background: #242424;
      color: #eee;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { background: #333; }

    button:disabled {
      opacity: 0.4;
      cursor: wait;
    }

    button:focus-visible,
    input:focus-visible,
    #treeSvg:focus-visible {
      outline: 2px solid #79e0ad;
      outline-offset: 4px;
    }

    #addButton {
      border-color: #79e0ad;
      background: #79e0ad;
      color: #082015;
      font-weight: bold;
    }

    #addButton:hover { background: #9cebc3; }

    #deleteButton {
      border-color: #794747;
      color: #ffaaaa;
    }

    #randomAddButton {
      border-color: #71613c;
      color: #ebce8b;
    }

    .hint {
      margin: 14px 0 0;
      color: #777;
      text-align: center;
      font-size: 12px;
    }

    #message {
      min-height: 42px;
      margin: 18px 0 0;
      color: #aaa;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      h1 { font-size: 22px; }
      .visualization { padding: 0 12px; }
      .controls { padding: 18px; }
      button { flex-basis: 100%; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>BST VISUALIZER</h1>
      <div id="engineStatus" role="status">C++ 엔진 로딩 중…</div>
    </header>

    <main class="visualization">
      <div id="treeArea">
        <svg
          id="treeSvg"
          xmlns="http://www.w3.org/2000/svg"
          tabindex="0"
          role="img"
          aria-label="이진 탐색 트리"
          aria-describedby="navigationHelp"
        >
          <g id="viewport"></g>
        </svg>

        <div id="emptyMessage">
          C++ 엔진을 준비하고 있습니다.
        </div>
      </div>

      <p class="navigation-hint" id="navigationHelp">
        휠: 확대·축소 · 좌클릭 드래그: 이동<br>
        노드 더블클릭: 삭제 · 빈 공간 더블클릭: 전체 보기<br>
        트리 영역 선택 후 방향키: 이동 · + / −: 확대·축소 · Home: 전체 보기
      </p>

      <div class="tree-info">
        <span>노드 수: <strong id="nodeCount">0</strong></span>
        <span>높이: <strong id="treeHeight">0</strong></span>
        <span>확대: <strong id="zoomValue">100%</strong></span>
      </div>

      <div class="inorder">
        <div class="inorder-label">INORDER · 중위순회</div>
        <div id="inorderValue" aria-live="polite">비어 있음</div>
      </div>
    </main>

    <section class="controls" aria-label="트리 조작">
      <div class="slider-heading">
        <label for="keySlider">KEY VALUE</label>
        <output id="keyValue" for="keySlider">30</output>
      </div>

      <input
        id="keySlider"
        type="range"
        min="1"
        max="1000"
        step="1"
        value="30"
        aria-describedby="sliderHelp"
      >

      <div class="range-labels" aria-hidden="true">
        <span>1</span>
        <span>500</span>
        <span>1000</span>
      </div>

      <div class="buttons">
        <button type="button" id="addButton" disabled>
          Add Node
        </button>
        <button type="button" id="deleteButton" disabled>
          Delete Node
        </button>
        <button type="button" id="randomAddButton" disabled>
          Add Random Node
        </button>
      </div>

      <p class="hint" id="sliderHelp">
        슬라이더 선택 후 방향키로 키값을 1씩 조절할 수 있습니다.
      </p>

      <p id="message" role="status" aria-live="polite">
        C++ 엔진을 불러오고 있습니다.
      </p>
    </section>
  </div>

  <script>
    const slider = document.getElementById("keySlider");
    const keyValue = document.getElementById("keyValue");
    const message = document.getElementById("message");

    const addButton = document.getElementById("addButton");
    const deleteButton = document.getElementById("deleteButton");
    const randomAddButton =
      document.getElementById("randomAddButton");

    const treeSvg = document.getElementById("treeSvg");
    const viewport = document.getElementById("viewport");
    const emptyMessage = document.getElementById("emptyMessage");

    const SVG_NS = "http://www.w3.org/2000/svg";

    let engine = null;
    let lastAddedKey = null;
    let currentNodes = [];
    let autoFit = true;
    let drag = null;

    const camera = { x: 0, y: 0, scale: 1 };

    function makeSvgElement(name, attributes, text) {
      const element = document.createElementNS(SVG_NS, name);

      for (const [key, value] of Object.entries(attributes)) {
        element.setAttribute(key, value);
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    function selectKey(key) {
      slider.value = key;
      keyValue.value = key;
    }

    function applyCamera() {
      viewport.setAttribute(
        "transform",
        `translate(${camera.x} ${camera.y}) scale(${camera.scale})`
      );

      const percent = camera.scale * 100;

      document.getElementById("zoomValue").textContent =
        `${percent < 10 ? percent.toFixed(1) : Math.round(percent)}%`;
    }

    function fitTree() {
      const width = treeSvg.clientWidth;
      const height = treeSvg.clientHeight;

      if (!width || !height) return;

      if (currentNodes.length === 0) {
        camera.x = width / 2;
        camera.y = height / 2;
        camera.scale = 1;
        applyCamera();
        return;
      }

      const minX = currentNodes[0].x - 30;
      const maxX = currentNodes[currentNodes.length - 1].x + 30;
      const minY = 20;

      let maxY = 0;

      for (const node of currentNodes) {
        maxY = Math.max(maxY, node.y);
      }

      maxY += 30;

      camera.scale = Math.min(
        1,
        Math.max(1, width - 48) / (maxX - minX),
        Math.max(1, height - 48) / (maxY - minY)
      );

      camera.x = width / 2 -
        ((minX + maxX) / 2) * camera.scale;

      camera.y = height / 2 -
        ((minY + maxY) / 2) * camera.scale;

      applyCamera();
    }

    function zoomAt(x, y, factor) {
      const oldScale = camera.scale;
      const nextScale = Math.min(
        5,
        Math.max(0.001, oldScale * factor)
      );

      const worldX = (x - camera.x) / oldScale;
      const worldY = (y - camera.y) / oldScale;

      camera.scale = nextScale;
      camera.x = x - worldX * nextScale;
      camera.y = y - worldY * nextScale;

      applyCamera();
    }

    treeSvg.addEventListener("wheel", (event) => {
      event.preventDefault();

      const rect = treeSvg.getBoundingClientRect();
      let delta = event.deltaY;

      if (event.deltaMode === 1) {
        delta *= 16;
      } else if (event.deltaMode === 2) {
        delta *= treeSvg.clientHeight;
      }

      delta = Math.max(-100, Math.min(100, delta));
      if (delta === 0) return;

      autoFit = false;

      zoomAt(
        event.clientX - rect.left,
        event.clientY - rect.top,
        Math.exp(-delta * 0.002)
      );
    }, { passive: false });

    treeSvg.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || drag !== null) return;

      event.preventDefault();
      treeSvg.focus({ preventScroll: true });

      drag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        cameraX: camera.x,
        cameraY: camera.y,
        moved: false
      };

      treeSvg.setPointerCapture(event.pointerId);
      treeSvg.classList.add("dragging");
    });

    treeSvg.addEventListener("pointermove", (event) => {
      if (!drag || drag.pointerId !== event.pointerId) return;

      const dx = event.clientX - drag.startX;
      const dy = event.clientY - drag.startY;

      // 작은 손떨림은 화면 이동으로 처리하지 않습니다.
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;

      drag.moved = true;
      autoFit = false;

      camera.x = drag.cameraX + dx;
      camera.y = drag.cameraY + dy;

      applyCamera();
    });

    function endDrag(event) {
      if (!drag || drag.pointerId !== event.pointerId) return;

      drag = null;
      treeSvg.classList.remove("dragging");

      if (treeSvg.hasPointerCapture(event.pointerId)) {
        treeSvg.releasePointerCapture(event.pointerId);
      }
    }

    treeSvg.addEventListener("pointerup", endDrag);
    treeSvg.addEventListener("pointercancel", endDrag);
    treeSvg.addEventListener("lostpointercapture", endDrag);

    // 이벤트 위임: 드래그의 pointer capture와 관계없이
    // 더블클릭한 위치에 실제 노드가 있는지 확인합니다.
    treeSvg.addEventListener("dblclick", (event) => {
      event.preventDefault();

      const hit = document.elementFromPoint(
        event.clientX,
        event.clientY
      );

      const nodeElement = hit?.closest(".node");

      if (nodeElement && viewport.contains(nodeElement)) {
        if (!engine) return;

        try {
          const key = Number(nodeElement.dataset.key);
          selectKey(key);
          deleteNode(key);
        } catch (error) {
          showError(error);
        }

        return;
      }

      autoFit = true;
      fitTree();
    });

    treeSvg.addEventListener("keydown", (event) => {
      if (event.key === "Home") {
        event.preventDefault();
        autoFit = true;
        fitTree();
        return;
      }

      const moves = {
        ArrowLeft: [40, 0],
        ArrowRight: [-40, 0],
        ArrowUp: [0, 40],
        ArrowDown: [0, -40]
      };

      if (moves[event.key]) {
        event.preventDefault();
        autoFit = false;
        camera.x += moves[event.key][0];
        camera.y += moves[event.key][1];
        applyCamera();
        return;
      }

      if (["+", "=", "-"].includes(event.key)) {
        event.preventDefault();
        autoFit = false;

        zoomAt(
          treeSvg.clientWidth / 2,
          treeSvg.clientHeight / 2,
          event.key === "-" ? 1 / 1.2 : 1.2
        );
      }
    });

    new ResizeObserver(() => {
      if (autoFit) fitTree();
    }).observe(treeSvg);

    function readTree() {
      return JSON.parse(engine.snapshot());
    }

    function collectKeys(node, result = []) {
      if (node === null) return result;

      collectKeys(node.left, result);
      result.push(node.key);
      collectKeys(node.right, result);

      return result;
    }

    function renderTree() {
      const root = readTree();
      currentNodes = [];
      let maxDepth = 0;

      function layout(node, depth) {
        if (node === null) return;

        layout(node.left, depth + 1);

        node.x = 50 + currentNodes.length * 76;
        node.y = 50 + depth * 90;
        currentNodes.push(node);

        maxDepth = Math.max(maxDepth, depth);
        layout(node.right, depth + 1);
      }

      layout(root, 0);

      document.getElementById("nodeCount").textContent =
        currentNodes.length;

      document.getElementById("treeHeight").textContent =
        maxDepth;

      document.getElementById("inorderValue").textContent =
        currentNodes.length
          ? currentNodes.map(node => node.key).join(" → ")
          : "비어 있음";

      treeSvg.setAttribute(
        "aria-label",
        `이진 탐색 트리, 노드 ${currentNodes.length}개`
      );

      viewport.replaceChildren();
      emptyMessage.hidden = root !== null;

      if (root === null) {
        emptyMessage.textContent =
          "트리가 비어 있습니다. Add Node로 첫 노드를 추가하세요.";

        autoFit = true;
        fitTree();
        return;
      }

      const fragment = document.createDocumentFragment();

      for (const node of currentNodes) {
        for (const [child, direction] of [
          [node.left, "L"],
          [node.right, "R"]
        ]) {
          if (child === null) continue;

          fragment.append(
            makeSvgElement("line", {
              x1: node.x,
              y1: node.y,
              x2: child.x,
              y2: child.y,
              stroke: "#555555",
              "stroke-width": 2
            })
          );

          fragment.append(
            makeSvgElement("text", {
              x: (node.x + child.x) / 2 + 8,
              y: (node.y + child.y) / 2 - 6,
              fill: "#999999",
              "font-size": 11,
              "font-family": "monospace"
            }, direction)
          );
        }
      }

      for (const node of currentNodes) {
        const highlighted = node.key === lastAddedKey;

        const group = makeSvgElement("g", {
          class: "node",
          "data-key": node.key
        });

        group.append(
          makeSvgElement("title", {},
            `키 ${node.key} · 더블클릭으로 삭제\n` +
            `왼쪽: ${node.left?.key ?? "없음"}, ` +
            `오른쪽: ${node.right?.key ?? "없음"}`
          )
        );

        group.append(
          makeSvgElement("circle", {
            cx: node.x,
            cy: node.y,
            r: 25,
            fill: highlighted ? "#79e0ad" : "#191919",
            stroke: highlighted ? "#79e0ad" : "#777777",
            "stroke-width": 2
          })
        );

        group.append(
          makeSvgElement("text", {
            x: node.x,
            y: node.y,
            fill: highlighted ? "#082015" : "#eeeeee",
            "font-size": 14,
            "font-family": "monospace",
            "text-anchor": "middle",
            "dominant-baseline": "middle"
          }, node.key)
        );

        fragment.append(group);
      }

      viewport.append(fragment);

      if (autoFit) {
        fitTree();
      } else {
        applyCamera();
      }
    }

    function showError(error) {
      console.error(error);
      message.textContent =
        "실행 중 오류가 발생했습니다. 브라우저 콘솔을 확인하세요.";
    }

    function addNode(key) {
      const result = engine.insert(key);

      if (result === 1) {
        lastAddedKey = key;
        selectKey(key);
        message.textContent = `${key} 노드를 추가했습니다.`;
      } else if (result === 0) {
        message.textContent = `${key} 키가 이미 존재합니다.`;
      } else {
        message.textContent = "키는 1~1000 사이여야 합니다.";
      }

      renderTree();
    }

    // 버튼 삭제와 노드 더블클릭 삭제가 같은 함수를 사용합니다.
    function deleteNode(key) {
      const result = engine.erase(key);

      if (result === 1) {
        lastAddedKey = null;
        message.textContent = `${key} 노드를 삭제했습니다.`;
      } else if (result === 0) {
        message.textContent = `${key} 키가 트리에 없습니다.`;
      } else {
        message.textContent = "키는 1~1000 사이여야 합니다.";
      }

      renderTree();
    }

    slider.addEventListener("input", () => {
      keyValue.value = slider.value;
    });

    addButton.addEventListener("click", () => {
      if (!engine) return;

      try {
        addNode(Number(slider.value));
      } catch (error) {
        showError(error);
      }
    });

    deleteButton.addEventListener("click", () => {
      if (!engine) return;

      try {
        deleteNode(Number(slider.value));
      } catch (error) {
        showError(error);
      }
    });

    randomAddButton.addEventListener("click", () => {
      if (!engine) return;

      try {
        const existingKeys = new Set(collectKeys(readTree()));
        const availableKeys = [];

        for (let key = 1; key <= 1000; key++) {
          if (!existingKeys.has(key)) {
            availableKeys.push(key);
          }
        }

        if (availableKeys.length === 0) {
          message.textContent =
            "1~1000 사이의 모든 키가 이미 존재합니다.";
          return;
        }

        const index = Math.floor(
          Math.random() * availableKeys.length
        );

        addNode(availableKeys[index]);
      } catch (error) {
        showError(error);
      }
    });

    async function initialize() {
      try {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "./bst.js";
          script.onload = resolve;
          script.onerror = () =>
            reject(new Error("bst.js를 불러오지 못했습니다."));

          document.head.append(script);
        });

        const module = await createBSTModule();

        engine = {
          insert: module.cwrap(
            "bst_insert", "number", ["number"]
          ),
          erase: module.cwrap(
            "bst_erase", "number", ["number"]
          ),
          snapshot: module.cwrap(
            "bst_snapshot", "string", []
          )
        };

        renderTree();

        addButton.disabled = false;
        deleteButton.disabled = false;
        randomAddButton.disabled = false;

        document.getElementById("engineStatus").textContent =
          "● C++ / WebAssembly 연결 완료";

        message.textContent =
          "키를 추가해보세요. 노드를 더블클릭하면 삭제됩니다.";
      } catch (error) {
        console.error(error);

        document.getElementById("engineStatus").textContent =
          "C++ 엔진 연결 실패";

        message.textContent =
          "같은 폴더에 bst.js와 bst.wasm이 있는지 확인하세요.";

        emptyMessage.hidden = false;
        emptyMessage.textContent =
          "C++ 엔진을 불러오지 못했습니다.";
      }
    }

    initialize();
  </script>
</body>
</html>
