<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BST Visualizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #eeeeee;
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 2px;
    }

    #engineStatus {
      margin: 10px 0 0;
      color: #888888;
      font-size: 13px;
    }

    .visualization {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #treeArea {
      height: 48vh;
      min-height: 260px;
      overflow: auto;
      padding: 12px;
    }

    #treeArea svg {
      display: block;
      margin: 0 auto;
    }

    .placeholder {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777777;
      text-align: center;
      line-height: 1.8;
    }

    .tree-edge {
      stroke: #555555;
      stroke-width: 2;
    }

    .edge-label {
      fill: #888888;
      font: 11px monospace;
    }

    .node circle {
      fill: #191919;
      stroke: #79e0ad;
      stroke-width: 2;
    }

    .node text {
      fill: #eeeeee;
      font: bold 14px monospace;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node.latest circle {
      fill: #79e0ad;
    }

    .node.latest text {
      fill: #082015;
    }

    .inorder-panel {
      width: min(920px, calc(100% - 32px));
      margin: 16px auto 0;
      padding: 14px 18px;
      border: 1px solid #282828;
      border-radius: 12px;
      background: #111111;
    }

    .inorder-heading {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: #888888;
      font-size: 12px;
    }

    #inorder {
      margin: 0;
      overflow-x: auto;
      color: #b9e8ce;
      font: 14px monospace;
      white-space: nowrap;
      line-height: 1.8;
    }

    .controls {
      width: min(720px, calc(100% - 32px));
      margin: 24px auto;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      border: 1px solid #303030;
      border-radius: 18px;
      background: #151515;
    }

    .slider-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .slider-heading label {
      color: #bbbbbb;
      font-size: 14px;
    }

    #keyValue {
      min-width: 76px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #242424;
      color: #79e0ad;
      text-align: center;
      font: bold 24px monospace;
    }

    #keySlider {
      width: 100%;
      margin: 0;
      accent-color: #79e0ad;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #777777;
      font-size: 12px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      flex: 1 1 160px;
      min-height: 46px;
      padding: 12px 16px;
      border: 1px solid #414141;
      border-radius: 9px;
      background: #242424;
      color: #eeeeee;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #333333;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #79e0ad;
      outline-offset: 4px;
    }

    #addButton {
      border-color: #79e0ad;
      background: #79e0ad;
      color: #082015;
      font-weight: bold;
    }

    #addButton:hover:not(:disabled) {
      background: #9cebc3;
    }

    #deleteButton {
      border-color: #794747;
      color: #ffaaaa;
    }

    #randomAddButton {
      border-color: #71613c;
      color: #ebce8b;
    }

    .help {
      margin: 14px 0 0;
      color: #777777;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    #message {
      min-height: 42px;
      margin: 16px 0 0;
      color: #aaaaaa;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    #message.error {
      color: #ffaaaa;
    }

    @media (max-width: 480px) {
      header {
        padding-top: 20px;
      }

      h1 {
        font-size: 22px;
      }

      .controls {
        padding: 18px;
      }

      button {
        flex-basis: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>BST VISUALIZER</h1>
      <p id="engineStatus">C++ 엔진을 불러오는 중...</p>
    </header>

    <main class="visualization">
      <div id="treeArea" aria-label="트리 시각화 영역">
        <p class="placeholder">잠시 기다려주세요.</p>
      </div>

      <section class="inorder-panel" aria-label="중위순회 결과">
        <div class="inorder-heading">
          <span>INORDER</span>
          <span id="nodeCount">노드 0개</span>
        </div>

        <p id="inorder">트리가 비어 있습니다.</p>
      </section>
    </main>

    <section class="controls" aria-label="트리 조작">
      <div class="slider-heading">
        <label for="keySlider">KEY VALUE</label>
        <output id="keyValue" for="keySlider">30</output>
      </div>

      <input
        id="keySlider"
        type="range"
        min="1"
        max="1000"
        step="1"
        value="30"
        aria-describedby="sliderHelp"
      >

      <div class="range-labels" aria-hidden="true">
        <span>1</span>
        <span>500</span>
        <span>1000</span>
      </div>

      <div class="buttons">
        <button type="button" id="addButton" disabled>
          Add Node
        </button>

        <button type="button" id="deleteButton" disabled>
          Delete Node
        </button>

        <button type="button" id="randomAddButton" disabled>
          Add Random Node
        </button>
      </div>

      <p id="sliderHelp" class="help">
        방향키로 키값을 1씩 조절할 수 있습니다.<br>
        큰 트리는 트리 영역을 스크롤해서 확인하세요.
      </p>

      <p id="message" role="status" aria-live="polite">
        C++ 엔진을 준비하고 있습니다.
      </p>
    </section>
  </div>
