<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BST Visualizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #eeeeee;
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 2px;
    }

    header p {
      margin: 10px 0 0;
      color: #888888;
      font-size: 14px;
    }

    #treeArea {
      flex: 1;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 24px;
    }

    .placeholder {
      color: #777777;
      text-align: center;
      line-height: 1.8;
    }

    /* 화면 아래 중앙에 배치 */
    .controls {
      width: min(720px, calc(100% - 32px));
      margin: 24px auto;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      border: 1px solid #303030;
      border-radius: 18px;
      background: #151515;
    }

    .slider-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .slider-heading label {
      color: #bbbbbb;
      font-size: 14px;
    }

    #keyValue {
      min-width: 76px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #242424;
      color: #79e0ad;
      text-align: center;
      font: bold 24px monospace;
    }

    #keySlider {
      width: 100%;
      margin: 0;
      accent-color: #79e0ad;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #777777;
      font-size: 12px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      flex: 1 1 160px;
      min-height: 46px;
      padding: 12px 16px;
      border: 1px solid #414141;
      border-radius: 9px;
      background: #242424;
      color: #eeeeee;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    button:hover {
      background: #333333;
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #79e0ad;
      outline-offset: 4px;
    }

    #addButton {
      border-color: #79e0ad;
      background: #79e0ad;
      color: #082015;
      font-weight: bold;
    }

    #addButton:hover {
      background: #9cebc3;
    }

    #deleteButton {
      border-color: #794747;
      color: #ffaaaa;
    }

    #randomAddButton {
      border-color: #71613c;
      color: #ebce8b;
    }

    #message {
      min-height: 42px;
      margin: 18px 0 0;
      color: #aaaaaa;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      header {
        padding-top: 22px;
      }

      h1 {
        font-size: 22px;
      }

      .controls {
        padding: 18px;
      }

      button {
        flex-basis: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>BST VISUALIZER</h1>
      <p>Binary Search Tree</p>
    </header>

    <main id="treeArea" aria-label="트리 시각화 영역">
      <p class="placeholder">
        이곳에 트리가 표시됩니다.<br>
        현재는 C++ 엔진 연결 전입니다.
      </p>
    </main>

    <section class="controls" aria-label="트리 조작">
      <div class="slider-heading">
        <label for="keySlider">KEY VALUE</label>
        <output id="keyValue" for="keySlider">30</output>
      </div>

      <input
        id="keySlider"
        type="range"
        min="1"
        max="1000"
        step="1"
        value="30"
        aria-describedby="sliderHelp"
      >

      <div class="range-labels" aria-hidden="true">
        <span>1</span>
        <span>500</span>
        <span>1000</span>
      </div>

      <div class="buttons">
        <button type="button" id="addButton">
          Add Node
        </button>

        <button type="button" id="deleteButton">
          Delete Node
        </button>

        <button type="button" id="randomAddButton">
          Add Random Node
        </button>
      </div>

      <p id="sliderHelp" style="
        margin: 14px 0 0;
        color: #777777;
        text-align: center;
        font-size: 12px;
      ">
        슬라이더 선택 후 방향키로 1씩 조절할 수 있습니다.
      </p>

      <p id="message" role="status" aria-live="polite">
        1~1000 사이의 키값을 선택하세요.
      </p>
    </section>
  </div>

  <script>
    const slider = document.getElementById("keySlider");
    const keyValue = document.getElementById("keyValue");
    const message = document.getElementById("message");

    const addButton = document.getElementById("addButton");
    const deleteButton = document.getElementById("deleteButton");
    const randomAddButton =
      document.getElementById("randomAddButton");

    /*
      다음 단계에서 C++ 연결 코드로 설정할 객체입니다.

      window.bstEngine = {
        insert(key): 성공 여부를 boolean으로 반환,
        erase(key): 성공 여부를 boolean으로 반환,
        keys(): 현재 트리의 키 배열을 반환,
        render(): 현재 트리를 화면에 표시
      };

      BST 삽입·삭제 알고리즘은 C++에서 실행할 예정입니다.
    */

    function getEngine() {
      const engine = window.bstEngine;

      if (!engine) {
        message.textContent =
          "버튼은 준비됐습니다. 실제 트리 조작은 C++ 엔진 연결 후 가능합니다.";
        return null;
      }

      return engine;
    }

    function showError(error) {
      console.error(error);

      message.textContent =
        "처리 중 오류가 발생했습니다. C++ 연결 상태를 확인하세요.";
    }

    // 슬라이더 변경 시 숫자 표시
    slider.addEventListener("input", () => {
      keyValue.value = slider.value;
    });

    // 선택한 키 삽입
    addButton.addEventListener("click", () => {
      const engine = getEngine();
      if (!engine) return;

      try {
        const key = Number(slider.value);
        const success = engine.insert(key);

        engine.render();

        message.textContent = success
          ? `${key} 노드를 추가했습니다.`
          : `${key} 노드를 추가하지 못했습니다. 중복 여부나 용량을 확인하세요.`;
      } catch (error) {
        showError(error);
      }
    });

    // 선택한 키 삭제
    deleteButton.addEventListener("click", () => {
      const engine = getEngine();
      if (!engine) return;

      try {
        const key = Number(slider.value);
        const success = engine.erase(key);

        engine.render();

        message.textContent = success
          ? `${key} 노드를 삭제했습니다.`
          : `${key} 키가 트리에 없습니다.`;
      } catch (error) {
        showError(error);
      }
    });

    // 1~1000 중 아직 트리에 없는 키를 무작위로 삽입
    randomAddButton.addEventListener("click", () => {
      const engine = getEngine();
      if (!engine) return;

      try {
        const min = Number(slider.min);
        const max = Number(slider.max);

        const existingKeys = new Set(engine.keys());
        const availableKeys = [];

        for (let key = min; key <= max; key++) {
          if (!existingKeys.has(key)) {
            availableKeys.push(key);
          }
        }

        if (availableKeys.length === 0) {
          message.textContent =
            "1~1000 사이의 모든 키가 이미 트리에 있습니다.";
          return;
        }

        const index = Math.floor(
          Math.random() * availableKeys.length
        );

        const key = availableKeys[index];
        const success = engine.insert(key);

        if (success) {
          slider.value = key;
          keyValue.value = key;
        }

        engine.render();

        message.textContent = success
          ? `무작위로 선택한 ${key} 노드를 추가했습니다.`
          : `${key} 노드를 추가하지 못했습니다.`;
      } catch (error) {
        showError(error);
      }
    });
  </script>
</body>
</html>
